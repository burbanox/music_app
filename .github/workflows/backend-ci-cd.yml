name: Backend CI/CD

on:
  pull_request:
    branches: [develop]
    paths:
      - 'backend/**'
      - 'database/**'
      - '.github/workflows/backend-ci-cd.yml'
      - 'deploy/backend/**'

  push:
    branches: [develop]
    paths:
      - 'backend/**'
      - 'database/**'
      - '.github/workflows/backend-ci-cd.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: chinook
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U postgres -d chinook"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create .env for tests
        run: |
          cat > .env <<EOF
          APP_NAME=Chinook API
          APP_ENV=test
          DEBUG=false
          API_V1_PREFIX=/api/v1
          POSTGRES_SERVER=localhost
          POSTGRES_PORT=5432
          POSTGRES_DB=chinook
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/chinook
          BACKEND_HOST=0.0.0.0
          BACKEND_PORT=8000
          SECRET_KEY=supersecretkey_change_this_in_production
          ALGORITHM=HS256
          ACCESS_TOKEN_EXPIRE_MINUTES=60
          CORS_ORIGINS=["http://localhost:3000"]
          EOF

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Wait for Postgres
        run: |
          python - <<'PY'
          import time
          import psycopg2
          for i in range(30):
              try:
                  conn = psycopg2.connect(
                      host="localhost",
                      port=5432,
                      dbname="chinook",
                      user="postgres",
                      password="postgres",
                  )
                  conn.close()
                  print("Postgres is ready")
                  break
              except Exception as e:
                  print(f"Waiting for Postgres... ({i+1}/30): {e}")
                  time.sleep(2)
          else:
              raise RuntimeError("Postgres did not become ready in time")
          PY

      - name: Load Chinook schema and data
        run: |
          export PGPASSWORD=postgres
          psql -h localhost -U postgres -d chinook -f ../database/chinook-data/Chinook_PostgreSql.sql

      - name: Create app tables
        run: |
          python - <<'PY'
          import app.models
          from app.db.init_db import init_db
          init_db()
          print("App tables created")
          PY

      - name: Run tests
        run: pytest -v

  deploy_backend:
    if: github.event_name == 'push'
    needs: test
    runs-on: [self-hosted, linux, x64, backend-deploy]

    steps:
      - name: Go to repo and update code
        run: |
          cd ~/music_app
          git fetch origin
          git checkout develop
          git reset --hard origin/develop

      - name: Rebuild and restart backend
        run: |
          cd ~/music_app/deploy/backend
          docker compose -f docker-compose.prod.yml down
          docker compose -f docker-compose.prod.yml up -d --build

      - name: Show backend containers
        run: docker ps