version: "3.9"

services:

  db:
    image: postgres:15
    container_name: chinook_postgres_local
    restart: always
    environment:
      POSTGRES_DB: chinook
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/chinook-data:/docker-entrypoint-initdb.d

  backend:
    build:
      context: ./backend
    container_name: chinook_backend
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      - db

  backend-test:
    build:
      context: ./backend
    command: pytest
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chinook_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

  frontend-test:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: test
    command: npm run test -- --run

volumes:
  postgres_data: